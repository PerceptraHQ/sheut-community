name: Rust dependency audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - .github/workflows/rust-audit.yml
  schedule:
    - cron: "43 4 * * 4"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: rust-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit Cargo.lock against RustSec
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # RustSec's action runs cargo-audit against the checked-in root lockfile
      # and publishes a failing check without granting repository write access.
      - name: Run cargo audit through RustSec
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: .
