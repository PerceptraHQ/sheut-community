name: Unverified alpha preview packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Unverified ${{ matrix.label }} preview
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            runner: windows-2025
            bundles: nsis,msi
          - label: Linux
            runner: ubuntu-24.04
            bundles: deb,appimage
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable pinned package manager
        run: corepack enable

      - name: Install Linux package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - name: Install JavaScript dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Build unsigned preview package
        run: corepack pnpm tauri build --bundles ${{ matrix.bundles }}
        env:
          CARGO_BUILD_JOBS: "2"
          GOMAXPROCS: "2"
          UV_THREADPOOL_SIZE: "2"

      - name: Upload explicitly unverified preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sheut-0.1.0-alpha-${{ matrix.label }}-UNVERIFIED
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 14
