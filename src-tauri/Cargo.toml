[package]
name = "sheut"
version.workspace = true
description = "A local-first cyber threat intelligence workbench"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sheut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = ["isolation"] }

[dependencies]
tauri = { version = "=2.11.5", features = ["isolation"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sheut-core = { path = "../crates/sheut-core" }
sheut-mitre = { path = "../crates/sheut-mitre" }
sheut-project = { path = "../crates/sheut-project" }
sheut-publish = { path = "../crates/sheut-publish" }
sheut-stix = { path = "../crates/sheut-stix" }
uuid.workspace = true
zeroize.workspace = true
rfd.workspace = true
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.10.1"
